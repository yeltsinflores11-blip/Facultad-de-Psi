<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNICA - Facultad de Psicología | Login</title>
    <link rel="icon" href="https://campus.unica.edu.pe/images/themes/unica/logo-report.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: #1a1d29;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            /* Efecto de entrada suave de la segunda versión */
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.loaded { opacity: 1; }

        .login-box {
            background-color: #24283b;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
            border-top: 5px solid #ff8c00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .sub-title { color: #ff8c00; font-size: 0.9rem; margin-bottom: 30px; display: block; }

        .logo-icon {
            font-size: 40px;
            color: #ff8c00;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1d29;
            border: 1px solid #3d445e;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #ff8c00; }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c5282;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background-color: #3b82f6; }

        /* Animación de Carga */
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff8c00;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-msg { color: #ff4d4d; font-size: 0.8rem; margin-top: 15px; display: none; }

        .hint-box {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #3d445e;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo-icon"><i class="fas fa-brain"></i></div>
    <div class="header-title">UNIVERSIDAD NACIONAL<br>"SAN LUIS GONZAGA"</div>
    <span class="sub-title">FACULTAD DE PSICOLOGÍA</span>
    
    <form id="loginForm">
        <input type="text" id="userInput" placeholder="Código (Ej: 202401)" required>
        <input type="password" id="pass" placeholder="Contraseña" required>
        
        <button type="submit" id="btnIngresar">INICIAR SESIÓN</button>
    </form>
    
    <div id="loader" class="loader"></div>
    <div id="error" class="error-msg">Código no reconocido. Reintente.</div>

    <div class="hint-box">
        <strong>Ayuda:</strong> Estudiantes (202401 - 202420) / Docente (profesor)
    </div>
</div>

<script>
    // BASE DE DATOS (Mantenemos la estructura de la función avanzada)
    const defaultStudents = [
        { id: 1, code: "202401", name: "Aguirre, Tatiana", role: "Alumno" },
        { id: 2, code: "202402", name: "Carhuas, Maria", role: "Alumno" },
        { id: 3, code: "202403", name: "Chavez, Kaysin", role: "Alumno" },
        { id: 4, code: "202404", name: "Fajardo, Oziel", role: "Alumno" },
        { id: 5, code: "202405", name: "Flores, Josue", role: "Alumno" },
        { id: 6, code: "202406", name: "Fernandez, Zenon", role: "Alumno" },
        { id: 7, code: "202407", name: "Fernandez, Sofia", role: "Alumno" },
        { id: 8, code: "202408", name: "Garcia, Miguel", role: "Alumno" },
        { id: 9, code: "202409", name: "Hernandez, Jose", role: "Alumno" },
        { id: 10, code: "202410", name: "Iglesias, Carmen", role: "Alumno" },
        { id: 11, code: "202411", name: "Jimenez, Raul", role: "Alumno" },
        { id: 12, code: "202412", name: "Lopez, Elena", role: "Alumno" },
        { id: 13, code: "202413", name: "Martinez, Carlos", role: "Alumno" },
        { id: 14, code: "202414", name: "Nuñez, Patricia", role: "Alumno" },
        { id: 15, code: "202415", name: "Ortega, David", role: "Alumno" },
        { id: 16, code: "202416", name: "Perez, Juan", role: "Alumno" },
        { id: 17, code: "202417", name: "Quispe, Rosa", role: "Alumno" },
        { id: 18, code: "202418", name: "Ramirez, Fernando", role: "Alumno" },
        { id: 19, code: "202419", name: "Sanchez, Lucía", role: "Alumno" },
        { id: 20, code: "202420", name: "Torres, Manuel", role: "Alumno" }
    ];

    // CARGAR BASE DE DATOS DINÁMICA
    function getStudentDB() {
        const stored = localStorage.getItem('global_students_db_v2');
        return stored ? JSON.parse(stored) : defaultStudents;
    }

    // Efecto de carga inicial
    document.addEventListener("DOMContentLoaded", () => document.body.classList.add('loaded'));

    // Lógica principal de acceso
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const input = document.getElementById('userInput').value.trim().toLowerCase();
        const errorDiv = document.getElementById('error');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('btnIngresar');
        const form = document.getElementById('loginForm');

        let usuarioEncontrado = null;

        // 1. VERIFICAR SI ES PROFESOR
        if (input === 'profesor' || input === 'docente') {
            usuarioEncontrado = { name: "DR. RICARDO PALOMINO", role: "Psicología", code: "PROFE01" };
        } else {
            // 2. BUSCAR EN BASE DE DATOS DE ALUMNOS
            const currentDB = getStudentDB();
            usuarioEncontrado = currentDB.find(s => s.code === input);
        }

        if (usuarioEncontrado) {
            // ÉXITO: Animación visual
            errorDiv.style.display = 'none';
            form.style.display = 'none';
            loader.style.display = 'block';

            // GUARDAR DATOS (Compatibilidad con ambos Dashboard)
            localStorage.setItem('userName', usuarioEncontrado.name);
            localStorage.setItem('usuarioNombre', usuarioEncontrado.name);
            localStorage.setItem('userRole', usuarioEncontrado.role === "Alumno" ? 'student' : 'teacher');
            localStorage.setItem('usuarioRol', usuarioEncontrado.role);

            // Redirigir
            setTimeout(() => {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = "dashboard.html"; // Asegúrate que el nombre de tu archivo sea este
                }, 500);
            }, 1500);
            
        } else {
            // ERROR
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Código no reconocido por la Facultad.";
        }
    });
</script>

</body>
</html>
